description = "This custom agent converts Markdown citations to IEEE numeric format and updates the References section accordingly."

prompt = """
# IEEE Indexing Workflow

Apply IEEE-style numeric indexing to citations in this markdown file: {{args}}

After completing the conversion, create a new markdown file named "markdown_ieee.md" and save it in the same directory. Then delete the original markdown file.

## IEEE Indexing Agent Rules (Markdown → IEEE [n])

Purpose: take a section Markdown file and produce an updated version where:
- inline citations are IEEE numeric indices like `[1]`, `[2]–[4]`
- the `### References` section is numbered as `[1] ...`, `[2] ...`

It is OK to be uncertain; prefer placing citations conservatively at the end of the sentence containing the claim.

### Input assumptions
- The file is a single thesis section with headings and paragraphs.
- Citations currently appear as Markdown links (often at paragraph ends), e.g. `...[sciencedirect](https://...)`.
- A `### References` block exists near the end, followed optionally by `### Glossary`.

### Output rules (keep it simple)
1. **No hyperlinks as citations in body**
   - Inline citations must be IEEE numeric only: `...[3].`
   - Do not keep `[...] (http...)` or `[label](url)` as the in-text citation.
2. **Single References and Glossary per section**
   - Keep exactly one `### References` block for the whole section.
   - Keep at most one `### Glossary` block (optional).
3. **IEEE numbering policy**
   - Number references by **order of first appearance in the body**.
   - If the same source appears multiple times, reuse the same index.
   - Use ranges only when helpful and safe, e.g., `[2]–[4]`.

### Heuristic procedure

#### Step A — Parse existing References
- Locate the `### References` heading.
- Collect the reference lines until the next heading of the same/higher level (e.g., `### Glossary`) or EOF.
- For each reference entry, extract:
  - the best URL (DOI URL preferred; otherwise publisher URL)
  - a short key based on URL host + path (used only for matching)

#### Step B — Find citations in the body
- Scan the body (everything before `### References`) for Markdown links that look like citations:
  - patterns like `[label](https://...)` at sentence/paragraph ends
  - bare URLs (if any)
For each citation occurrence:
- Determine the **claim span** (usually the sentence containing the citation).
- Choose the safest placement for the IEEE index:
  - prefer sentence end: `... conditions.[1]`
  - for numeric/statistical claims: place right after the sentence that states the number

#### Step C — Match body citations to References
Try matching in this order:
1. Exact URL match (including DOI URL)
2. Same DOI (if DOI appears in either string)
3. Same host + same path prefix
4. Same host only (last resort)
If no match is found:
- Create a new reference entry from the link (minimal IEEE fields + URL) and add it to the References list.

#### Step D — Assign numbers and rewrite
- Assign the next available number when a source appears the first time.
- Replace each in-body Markdown citation link with the numeric index:
  - `...[sciencedirect](https://...)` → `...[1]`
- Remove leftover citation hyperlinks in the body.
- Rewrite `### References` so every entry starts with `- [n] ` and `n` matches the mapping.

### Formatting guidance
- Keep the existing headings and prose unchanged except for citation replacement.
- Use this shape for references:
```md
### References

- [1] A. Author and B. Author, \"Title,\" _Venue_, vol. X, no. Y, pp. 1–10, 2024, doi: 10.xxxx/xxxx. [Online]. Available: https://doi.org/...
- [2] ...
```
If full bibliographic metadata is not available, still number it and keep it usable:
- [n] \"Document title,\" Organization/Venue, Year. [Online]. Available: https://...

### Quick sanity checks
- Every `[n]` used in the body exists in `### References`.
- No `[label](url)` remains in the body as a citation.
- References are sequential and start at `[1]`.
- `### Glossary` (if present) remains after `### References`.
"""
