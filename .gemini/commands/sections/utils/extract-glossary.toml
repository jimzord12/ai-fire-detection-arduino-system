name = "extract-glossary"
description = "Extracts glossary terms from a markdown file, saves them to a glossary file, and renames the source file to signify completion (Implements Step 1.4 of the thesis workflow)."
author = "Gemini"
version = "0.1.0"

# This command takes one argument: the path to the markdown file.
argument = { file_path = { type = "string", description = "Path to the markdown_ieee.md file to process." } }

# The prompt is a Python script that will be executed.
prompt = '''
import re
import os

def build_processed_path(file_path):
    root, ext = os.path.splitext(file_path)
    return f"{root}_no_glossary{ext or '.md'}"


def extract_glossary(file_path):
    if not os.path.exists(file_path):
        print(f"Error: File not found at {file_path}")
        return

    try:
        with open(file_path, 'r', encoding='utf-8') as f:
            content = f.read()
    except Exception as e:
        print(f"Error reading file: {e}")
        return

    # Find a "Glossary" heading and capture content until the next heading or EOF.
    glossary_match = re.search(
        r'^(#{1,6})\s+Glossary\s*$\n(.*?)(?=^#{1,6}\s+|\Z)',
        content,
        re.DOTALL | re.IGNORECASE | re.MULTILINE,
    )

    if not glossary_match:
        print("No glossary section found. Renaming file to signify completion of this step.")
        if "_no_glossary" not in file_path:
            new_file_path = build_processed_path(file_path)
            os.rename(file_path, new_file_path)
            print(f"Renamed file to {new_file_path}")
        else:
            print("File already appears to have been processed.")
        return

    glossary_content_full = glossary_match.group(0)
    glossary_terms_text = glossary_match.group(2)

    # Extract terms in the format **Term**: Definition, optionally prefixed by a list bullet.
    terms = re.findall(
        r'^\s*(?:[-*]\s+)?\*\*(.*?)\*\*:\s*(.+)$',
        glossary_terms_text,
        re.MULTILINE,
    )

    dir_path = os.path.dirname(file_path)
    glossary_file_path = os.path.join(dir_path, 'glossary.md')

    if terms:
        # Append extracted terms to the section's glossary.md file
        with open(glossary_file_path, 'a', encoding='utf-8') as f:
            if os.path.exists(glossary_file_path) and os.path.getsize(glossary_file_path) > 0:
                f.write('\n')
            for term, definition in terms:
                f.write(f"**{term.strip()}**: {definition.strip()}\n")
        print(f"Appended {len(terms)} terms to {glossary_file_path}")
    else:
        print("Glossary section found, but no terms in the expected format were extracted.")

    # Remove exactly the matched glossary section from the source content.
    start, end = glossary_match.span(0)
    new_content = (content[:start] + content[end:]).strip()

    # Create the new filename
    new_file_path = build_processed_path(file_path)

    # Write the content to the new file
    with open(new_file_path, 'w', encoding='utf-8') as f:
        f.write(new_content)

    # Remove the old file
    os.remove(file_path)

    print(f"Glossary extracted. Original file removed. New file created at {new_file_path}")

# Main execution
file_to_process = "{{file_path}}"
extract_glossary(file_to_process)
'''
interpreter = "aici.py"
